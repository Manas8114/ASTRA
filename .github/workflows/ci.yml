name: ASTRA CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ruff lint
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pytest with coverage
        run: |
          uv run pytest \
            --tb=short \
            -v \
            --junitxml=test-results.xml \
            --cov=xapp \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing
        env:
          DEV_MODE: "true"
          ASTRA_MODE: "demo"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Helm chart
        run: helm lint helm/astra-xapp -f helm/astra-xapp/values-dev.yaml

      - name: Template render (dry-run)
        run: helm template astra helm/astra-xapp -f helm/astra-xapp/values-dev.yaml

  build-push:
    name: Docker Build & Push
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push xApp image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: xapp/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/xapp:latest
            ghcr.io/${{ github.repository }}/xapp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Twin Service image
        uses: docker/build-push-action@v6
        with:
          context: twin-service
          file: twin-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/twin-service:latest
            ghcr.io/${{ github.repository }}/twin-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
