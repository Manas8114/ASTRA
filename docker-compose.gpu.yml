# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.gpu.yml — GPU Override
#
# Use with: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Prerequisites:
#   1. NVIDIA GPU with drivers installed
#   2. NVIDIA Container Toolkit: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
#   3. Docker Desktop with GPU support enabled
# ─────────────────────────────────────────────────────────────────────────────

services:
  astra:
    build:
      context: .
      dockerfile: xapp/Dockerfile
      args:
        USE_GPU: "true"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - ASTRA_FORCE_CPU=false
      - ASTRA_GPU_MEM_FRACTION=0.8
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
