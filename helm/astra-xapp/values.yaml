replicaCount: 1

image:
  repository: astra-xapp
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8000

twin:
  image:
    repository: astra-twin
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

redis:
  image:
    repository: redis
    tag: "7.2-alpine"
    pullPolicy: IfNotPresent
  storageSize: 1Gi
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

env:
  ASTRA_MODE: "prod"
  LOG_LEVEL: "INFO"
  REDIS_HOST: "redis-master"

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

# ── Ingress ────────────────────────────────────────────────────────────────
ingress:
  className: nginx
  enabled: true
  hosts:
    - astra-xapp.local
  paths:
    - path: /
      pathType: Prefix
      port: 8000
  tls:
    enabled: true
    secretName: astra-xapp-tls
    hosts:
      - astra-xapp.local
  annotations: {}
  proxyBodySize: "10m"
  proxyReadTimeout: "60"
  proxySendTimeout: "60"

# ── HPA (Horizontal Pod Autoscaler) ───────────────────────────────────────
hpa:
  minReplicas: 1
  maxReplicas: 3
  metrics:
    cpu:
      enabled: true
      targetUtilization: 70
    memory:
      enabled: true
      targetUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15

# ── Twin HPA ───────────────────────────────────────────────────────────────
twin:
  hpa:
    minReplicas: 1
    maxReplicas: 2
    metrics:
      cpu:
        enabled: true
        targetUtilization: 70
      memory:
        enabled: true
        targetUtilization: 80
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Percent
            value: 10
            periodSeconds: 60
          - type: Pods
            value: 1
            periodSeconds: 60
      scaleUp:
        stabilizationWindowSeconds: 0
        policies:
          - type: Percent
            value: 100
            periodSeconds: 15
          - type: Pods
            value: 1
            periodSeconds: 15

# ── Pod Disruption Budget ─────────────────────────────────────────────────
pdb:
  minAvailable: 1

twin:
  pdb:
    minAvailable: 1

# ── Network Policy ─────────────────────────────────────────────────────────
networkPolicy:
  enabled: true
  egress:
    externalEnabled: false
    allowedNamespaces:
      - kube-system
      - monitoring

# ── Secrets ────────────────────────────────────────────────────────────────
secrets:
  # astra-control-api-key: ""
  # astra-admin-token: ""
  # astra-viewer-token: ""
  # oidc-issuer: ""
  # a1-api-key: ""
  # database-url: ""
  # redis-password: ""
  # otel-endpoint: ""

# ── Prometheus Rules ──────────────────────────────────────────────────────
prometheusRule:
  enabled: true
  prometheusLabel: "prometheus"
  alerts:
    anomalyRateHigh:
      enabled: true
      threshold: 0.1
      for: "2m"
    healingFailure:
      enabled: true
      threshold: 0
      for: "1m"
    forecastDrift:
      enabled: true
      threshold: 0.5
      for: "5m"
    mseRegression:
      enabled: true
      multiplier: 1.5
      for: "5m"
    e2ConnectionDown:
      enabled: true
      for: "1m"
    redisDown:
      enabled: true
      for: "1m"
    forecastErrorHigh:
      enabled: true
      threshold: 0.5
      for: "5m"
    circuitBreakerOpen:
      enabled: true
      for: "1m"
    websocketQueueHigh:
      enabled: true
      threshold: 0.8
      for: "5m"
    driftDetected:
      enabled: true
      for: "1m"

# ── Observability ──────────────────────────────────────────────────────────
observability:
  enableTracing: false
  otelEndpoint: ""
  logLevel: INFO
  logFormat: json