apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secrets" (include "astra-xapp.fullname" .) | quote }}
  labels:
    app.kubernetes.io/name: {{ include "astra-xapp.name" . }}
type: Opaque
stringData:
  {{- if .Values.secrets.astraControlApiKey }}
  astra-control-api-key: {{ .Values.secrets.astraControlApiKey }}
  {{- end }}
  {{- if .Values.secrets.astraAdminToken }}
  astra-admin-token: {{ .Values.secrets.astraAdminToken }}
  {{- end }}
  {{- if .Values.secrets.astraViewerToken }}
  astra-viewer-token: {{ .Values.secrets.astraViewerToken }}
  {{- end }}
  {{- if .Values.secrets.oidcIssuer }}
  oidc-issuer: {{ .Values.secrets.oidcIssuer }}
  {{- end }}
  {{- if .Values.secrets.a1ApiKey }}
  a1-api-key: {{ .Values.secrets.a1ApiKey }}
  {{- end }}
  {{- if .Values.secrets.databaseUrl }}
  database-url: {{ .Values.secrets.databaseUrl }}
  {{- end }}
  {{- if .Values.secrets.redisPassword }}
  redis-password: {{ .Values.secrets.redisPassword }}
  {{- end }}
  {{- if .Values.secrets.otelEndpoint }}
  otel-endpoint: {{ .Values.secrets.otelEndpoint }}
  {{- end }}