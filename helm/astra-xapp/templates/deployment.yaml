apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "astra-xapp.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "astra-xapp.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "astra-xapp.name" . }}
      app.kubernetes.io/component: xapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "astra-xapp.name" . }}
        app.kubernetes.io/component: xapp
      annotations:
        {{- if .Values.prometheusRule.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
        {{- end }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ printf "%s-config" (include "astra-xapp.fullname" .) }}
            {{- if .Values.secrets }}
            - secretRef:
                name: {{ printf "%s-secrets" (include "astra-xapp.fullname" .) }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
