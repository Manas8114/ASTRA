apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ printf "%s-redis" (include "astra-xapp.fullname" .) }}
  labels:
    app.kubernetes.io/name: {{ printf "%s-redis" (include "astra-xapp.name" .) }}
spec:
  serviceName: {{ printf "%s-redis" (include "astra-xapp.fullname" .) }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ printf "%s-redis" (include "astra-xapp.name" .) }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ printf "%s-redis" (include "astra-xapp.name" .) }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            limits:
              cpu: {{ .Values.redis.resources.limits.cpu }}
              memory: {{ .Values.redis.resources.limits.memory }}
            requests:
              cpu: {{ .Values.redis.resources.requests.cpu }}
              memory: {{ .Values.redis.resources.requests.memory }}
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.redis.storageSize }}
