apiVersion: v1
kind: Service
metadata:
  name: {{ include "astra-xapp.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "astra-xapp.name" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/name: {{ include "astra-xapp.name" . }}
