apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-twin" (include "astra-xapp.fullname" .) | quote }}
  labels:
    app.kubernetes.io/name: {{ printf "%s-twin" (include "astra-xapp.name" .) | quote }}
spec:
  type: ClusterIP
  ports:
    - port: 50051
      targetPort: grpc
      protocol: TCP
      name: grpc
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/name: {{ printf "%s-twin" (include "astra-xapp.name" .) | quote }}
    app.kubernetes.io/component: twin
