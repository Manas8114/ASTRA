apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-redis" (include "astra-xapp.fullname" .) | quote }}
  labels:
    app.kubernetes.io/name: {{ printf "%s-redis" (include "astra-xapp.name" .) | quote }}
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: {{ printf "%s-redis" (include "astra-xapp.name" .) | quote }}
    app.kubernetes.io/component: redis
