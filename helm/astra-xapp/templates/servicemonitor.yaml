apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "astra-xapp.fullname" . }}-monitor
  labels:
    app.kubernetes.io/name: {{ include "astra-xapp.name" . }}
    release: {{ .Values.prometheusRule.prometheusLabel }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "astra-xapp.name" . }}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
    - port: metrics
      path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
